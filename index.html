

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fancy Furniture | Luxury Handcrafted Furniture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              stone: {
                950: '#180c07', // Deep warm dark walnut wood grain
                900: '#25130b', // Rich dark mahogany wood grain
                850: '#311b10',
                800: '#3e2215', // Warm wood tone
                700: '#593320', // Warm wood border tone
                600: '#79462e',
                500: '#9b5c3d',
                400: '#c28562',
                300: '#ddb197',
                200: '#edd8cb',
                100: '#f7eeea',
                50: '#fcf8f6'
              },
              neutral: {
                950: '#180c07',
                900: '#25130b',
                800: '#3e2215',
                700: '#593320'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['Cinzel', 'serif']
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="./css/index.css">
  </head>
  <body class="bg-[#faf8f5] text-stone-900 font-sans antialiased selection:bg-amber-800 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
